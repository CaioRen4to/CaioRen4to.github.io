<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Social preview · Portfólio</title><style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden;background:#0B0F17;font-family:'Segoe UI', ui-sans-serif, -apple-system, Roboto, Helvetica, Arial, sans-serif;color:#F8FAFC}
.canvas{position:relative;width:1280px;height:640px;overflow:hidden;

  radial-gradient(40% 60% at 5% 100%,rgba(99,102,241,.22),transparent 70%),#0B0F17}
.bar{position:absolute;left:0;top:0;width:100%;height:6px;background:linear-gradient(90deg,#6366F1,#06B6D4,#10B981)}
.pill{display:inline-flex;align-items:center;gap:10px;font:700 17px ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;letter-spacing:.08em;color:#22D3EE;background:#0F172A;border:1px solid #1E293B;padding:9px 18px;border-radius:999px}

.copy{position:absolute;left:72px;top:64px;width:640px}
h1{font-size:104px;line-height:1.14;padding-bottom:4px;white-space:nowrap;font-weight:800;letter-spacing:-4px;margin:30px 0 18px;background:linear-gradient(100deg,#F8FAFC 45%,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:29px;line-height:1.3;color:#CBD5E1;max-width:640px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.chip{font:700 20px ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;padding:9px 20px;border-radius:999px;border:2px solid currentColor;background:#0F172A}
.url{position:absolute;left:72px;bottom:36px;font:600 22px ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;color:#94A3B8}
.url b{color:#22D3EE;font-weight:700}
</style></head><body><div class="canvas"><div class="bar"></div>
